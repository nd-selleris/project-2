<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up — Sort Company</title>

    <!-- 1. Normalize -->
    <link rel="stylesheet" href="https://necolas.github.io/normalize.css/8.0.1/normalize.css" />

    <!-- Fonts and icons from Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />

    <!-- 2. Reset, 3. Variables, then layout, components, pages and media queries -->
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>

  <body>
    <div class="app">
      <!-- Sidebar (on mobile it becomes the top-left icons) -->
      <aside class="sidebar">
        <details class="dropdown dropdown--search">
          <summary class="icon-button" aria-label="Search"><span class="material-symbols-rounded" aria-hidden="true">search</span></summary>
          <form class="dropdown__panel search" action="https://sortcompany.shop/search" method="get">
            <label class="visually-hidden" for="search-input">Search products</label>
            <input class="search__input" id="search-input" type="search" name="q" placeholder="Search products…" />
            <button class="search__button" type="submit" aria-label="Search"><span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span></button>
          </form>
        </details>

        <details class="dropdown dropdown--menu">
          <summary class="icon-button icon-button--filled" aria-label="Categories"><span class="material-symbols-rounded" aria-hidden="true">apps</span></summary>
          <nav class="dropdown__panel" aria-label="Categories">
            <p class="dropdown__title">Categories</p>
            <ul>
              <li><a class="dropdown__link" href="index.html#puffer">Jackets</a></li>
              <li><a class="dropdown__link" href="index.html#ghost-hoodie">Hoodies</a></li>
              <li><a class="dropdown__link" href="index.html#target-jeans">Jeans</a></li>
              <li><a class="dropdown__link" href="index.html#kitty-tee">Tees</a></li>
              <li><a class="dropdown__link" href="index.html#face-beanie">Accessories</a></li>
            </ul>
          </nav>
        </details>
      </aside>

      <header class="header">
        <nav class="nav" aria-label="Main">
          <ul class="nav__list">
            <li><a class="nav__link" href="home.html">Home</a></li>
            <li><a class="nav__link" href="index.html">Products</a></li>
            <li><a class="nav__link" href="lookbook.html">Lookbook</a></li>
            <li><a class="nav__link" href="about.html">About</a></li>
          </ul>
        </nav>

        <div class="auth">
          <a class="button button--primary" href="login.html">Log in</a>
          <a class="button button--light button--current" href="signup.html">Sign up</a>
        </div>
      </header>

      <main class="main main--center">
        <section class="form-card">
          <h1 class="form-card__title">Sign up</h1>
          <p class="form-card__text">Create an account to get early access to new drops.</p>

          <form class="form" action="#" method="post">
            <div class="field">
              <label class="field__label" for="name">Name</label>
              <input class="field__input" id="name" type="text" name="name" placeholder="Your name" required />
            </div>
            <div class="field">
              <label class="field__label" for="email">Email</label>
              <input class="field__input" id="email" type="email" name="email" placeholder="you@example.com" required />
            </div>
            <div class="field">
              <label class="field__label" for="password">Password</label>
              <input class="field__input" id="password" type="password" name="password" placeholder="At least 8 characters" required />
            </div>
            <button class="button button--primary button--wide" type="submit">Create account</button>
          </form>

          <p class="form-card__alt">Already have an account? <a href="login.html">Log in</a></p>
        </section>
      </main>
    </div>
  </body>
</html>
